<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">MifiTech digital studio workspace</title>
<desc id="desc">A polished digital product workspace illustration with a browser, phone and floating interface cards.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081419"/><stop offset=".55" stop-color="#10232a"/><stop offset="1" stop-color="#241426"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122f3a"/><stop offset="1" stop-color="#101b2c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a63"/><stop offset="1" stop-color="#ff5d3d"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31dcff"/><stop offset="1" stop-color="#7880ff"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".34"/></filter>
</defs>
<rect width="1000" height="620" rx="34" fill="url(#bg)"/>
<circle cx="850" cy="105" r="190" fill="#27dfff" opacity=".12" filter="url(#blur)"/>
<circle cx="165" cy="520" r="220" fill="#ff6d4b" opacity=".12" filter="url(#blur)"/>
<path d="M0 505C170 430 260 570 430 500s300-95 570 15" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>

<!-- browser -->
<g filter="url(#shadow)">
  <rect x="118" y="92" width="690" height="390" rx="28" fill="#071015" stroke="#38515b" stroke-width="3"/>
  <rect x="138" y="114" width="650" height="344" rx="18" fill="url(#screen)"/>
  <rect x="138" y="114" width="650" height="42" rx="18" fill="#0b171c"/>
  <circle cx="164" cy="135" r="6" fill="#ff6f60"/><circle cx="184" cy="135" r="6" fill="#ffc95c"/><circle cx="204" cy="135" r="6" fill="#62d99a"/>
  <rect x="265" y="127" width="320" height="16" rx="8" fill="#172b33"/>
  <circle cx="278" cy="135" r="4" fill="#4b6872"/>

  <rect x="166" y="184" width="190" height="230" rx="18" fill="#0b1b22" stroke="#29434c"/>
  <rect x="190" y="210" width="142" height="10" rx="5" fill="#2bdcff"/>
  <rect x="190" y="236" width="105" height="9" rx="4.5" fill="#8cf4a5"/>
  <rect x="190" y="259" width="126" height="9" rx="4.5" fill="#ff70d2"/>
  <rect x="190" y="282" width="88" height="9" rx="4.5" fill="#7b86ff"/>
  <rect x="190" y="325" width="118" height="48" rx="14" fill="url(#accent)"/>
  <text x="213" y="355" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#fff">START A PROJECT</text>

  <rect x="382" y="184" width="374" height="230" rx="18" fill="#0b1920" stroke="#29434c"/>
  <text x="408" y="222" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="2" fill="#ff916f">MIFITECH / DIGITAL STUDIO</text>
  <text x="408" y="270" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#f5f8f8">Build useful digital</text>
  <text x="408" y="306" font-family="Arial,sans-serif" font-size="31" font-weight="800" fill="#f5f8f8">products that work.</text>
  <rect x="408" y="333" width="180" height="8" rx="4" fill="#2bdcff"/><rect x="408" y="354" width="230" height="8" rx="4" fill="#7c82ff"/><rect x="408" y="375" width="150" height="8" rx="4" fill="#7cf29a"/>
</g>

<!-- phone -->
<g filter="url(#shadow)" transform="rotate(6 792 366)">
  <rect x="726" y="188" width="176" height="342" rx="34" fill="#050c11" stroke="#46636d" stroke-width="4"/>
  <rect x="744" y="211" width="140" height="294" rx="22" fill="#0d2028"/>
  <rect x="776" y="225" width="76" height="8" rx="4" fill="#263f49"/>
  <circle cx="814" cy="294" r="38" fill="url(#cyan)"/>
  <path d="M792 294h44M814 272v44" stroke="#07131a" stroke-width="6" stroke-linecap="round"/>
  <rect x="770" y="357" width="88" height="11" rx="5.5" fill="#294550"/>
  <rect x="770" y="382" width="68" height="11" rx="5.5" fill="#294550"/>
  <rect x="770" y="426" width="88" height="42" rx="13" fill="url(#accent)"/>
</g>

<!-- floating cards -->
<g filter="url(#shadow)">
  <rect x="46" y="170" width="146" height="92" rx="18" fill="#f8f5ed"/>
  <circle cx="75" cy="200" r="13" fill="#ff8a63" opacity=".2"/><circle cx="75" cy="200" r="6" fill="#ff7754"/>
  <text x="98" y="201" font-family="Arial,sans-serif" font-size="11" font-weight="800" fill="#25343a">DESIGN</text>
  <text x="66" y="230" font-family="Arial,sans-serif" font-size="10" fill="#718087">Clear. Useful. Fast.</text>
  <rect x="66" y="245" width="80" height="5" rx="2.5" fill="#d9dfe0"/>

  <rect x="720" y="82" width="188" height="72" rx="18" fill="#f8f5ed"/>
  <text x="742" y="111" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#26373d">LIVE PROJECT</text>
  <circle cx="867" cy="109" r="6" fill="#67c98b"/>
  <text x="742" y="136" font-family="Arial,sans-serif" font-size="11" fill="#718087">Ready for every screen</text>
</g>

<text x="54" y="575" font-family="Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2.6" fill="#9aafb4">STRATEGY · DESIGN · DEVELOPMENT · LAUNCH</text>
<text x="942" y="575" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2.2" fill="#ff9675">MIFITECH.</text>
</svg>